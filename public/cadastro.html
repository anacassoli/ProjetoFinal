<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Questões</title>

  <link rel="stylesheet"
        href="cadastro.css">
</head>

<body>

  <header>

    <h1>
      Questões de Vestibular
    </h1>

    <button id="logoutButton">
      Sair
    </button>

  </header>

  <main>

    <div class="form-row">

      <input
        type="text"
        id="searchInput"
        placeholder="Buscar tema..."
      >

      <button id="searchButton">
        Buscar
      </button>

      <button id="refreshButton">
        Atualizar
      </button>

    </div>

    <div id="message"></div>

    <table border="1">

      <thead>

        <tr>
          <th>Tema</th>
          <th>Vestibular</th>
          <th>Ano</th>
          <th>Pergunta</th>
          <th>Resposta</th>
        </tr>

      </thead>

      <tbody id="questionTable">

      </tbody>

    </table>

  </main>

  <script src="cadastro.js"></script>

</body>
</html>
