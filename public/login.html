<!DOCTYPE html>
<html lang="pt-BR">

<head>


  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0" 
  />
<!--a página se adapta em diferentes tamanhos de tela-->

  <title>
    Login - Consultoria de Questões
  </title>

  <link
    rel="stylesheet"
    href="login.css"
  />

</head>

<body>

  <header>

    <h1>
      Consultoria de Questões
    </h1>

    <p>
      Faça login para acessar a plataforma.
    </p>

  </header>

  <main>

    <section class="panel login-panel">

      <h2>
        Login
      </h2>

      <div 
        id="message"
        class="message"
      ></div> <!-- exibir mensagens ao usuário, como erros de login ou confirmações de acesso -->

      <form id="loginForm">

        <div class="form-row">

          <label for="email">
            E-mail
          </label>

          <input
            id="email"
            type="email"
            placeholder="Digite seu e-mail"
            required
          />

        </div>

        <div class="form-row">

          <label for="password">
            Senha
          </label>

          <input
            id="password"
            type="password"
            placeholder="Digite sua senha"
            required
          />

        </div>

        <div class="button-row">

          <button type="submit">
            Entrar
          </button>

        </div>

      </form>

    </section>

  </main>

  <script src="app.js"></script>
  <!--importação do arquivo JavaScript. Responsável pela lógica do sistema, como validação dos dados, comunicação com o servidor e autenticação do usuário.-->

</body>

</html>
